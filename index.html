<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Gửi Em Yêu - Mùa Trăng Tròn</title>
  <!-- Google Fonts & Confetti -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Dancing+Script:wght@600;700&family=Nunito:wght@400;600;700&display=swap" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>

  <style>
    :root {
      --bg-gradient: radial-gradient(circle at 80% 20%, #1e1b4b 0%, #0f172a 60%, #020617 100%);
      --accent-yellow: #fde047;
      --accent-pink: #f472b6;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      min-height: 100vh;
      background: var(--bg-gradient);
      font-family: 'Nunito', sans-serif;
      color: #fff;
      overflow-x: hidden;
      display: flex;
      flex-direction: column;
      align-items: center;
      position: relative;
      padding-bottom: 60px;
    }

    /* Vầng trăng phát sáng */
    .moon {
      position: fixed;
      top: 25px;
      right: 30px;
      width: 85px;
      height: 85px;
      background: #fef08a;
      border-radius: 50%;
      box-shadow: 0 0 35px #fde047, 0 0 70px rgba(253, 224, 71, 0.4);
      z-index: 1;
      pointer-events: none;
    }

    /* Đèn lồng bay bổng */
    .lantern {
      position: fixed;
      width: 38px;
      height: 48px;
      background: #f43f5e;
      border-radius: 8px 8px 16px 16px;
      box-shadow: 0 0 20px rgba(244, 63, 94, 0.8);
      animation: float 5s ease-in-out infinite alternate;
      z-index: 1;
    }
    .lantern::after {
      content: '';
      position: absolute;
      bottom: -10px;
      left: 16px;
      width: 6px;
      height: 10px;
      background: #fbbf24;
    }
    .lantern-1 { top: 15%; left: 8%; animation-delay: 0s; }
    .lantern-2 { top: 30%; right: 10%; animation-delay: 1.5s; transform: scale(0.85); }

    @keyframes float {
      0% { transform: translateY(0px) rotate(-3deg); }
      100% { transform: translateY(-20px) rotate(4deg); }
    }

    /* Khung mở quà */
    .main-wrapper {
      position: relative;
      z-index: 2;
      width: 92%;
      max-width: 500px;
      margin-top: 40px;
      padding: 30px 24px;
      background: rgba(255, 255, 255, 0.1);
      backdrop-filter: blur(14px);
      -webkit-backdrop-filter: blur(14px);
      border-radius: 28px;
      border: 1px solid rgba(255, 255, 255, 0.2);
      box-shadow: 0 20px 45px rgba(0, 0, 0, 0.5);
      text-align: center;
    }

    .title {
      font-size: 1.8rem;
      font-weight: 700;
      color: var(--accent-yellow);
      margin-bottom: 8px;
    }

    .subtitle {
      font-size: 0.95rem;
      color: #cbd5e1;
      margin-bottom: 20px;
    }

    .gift-btn {
      cursor: pointer;
      font-size: 4.5rem;
      display: inline-block;
      transition: transform 0.3s cubic-bezier(0.34, 1.56, 0.64, 1);
      user-select: none;
      filter: drop-shadow(0 6px 14px rgba(253, 224, 71, 0.4));
    }
    .gift-btn:hover {
      transform: scale(1.15) rotate(6deg);
    }

    .tap-hint {
      margin-top: 8px;
      font-size: 0.85rem;
      color: #fbcfe8;
    }

    /* Thư tay */
    .letter-box {
      display: none;
      margin-top: 20px;
      padding: 18px 16px;
      background: rgba(15, 23, 42, 0.7);
      border-radius: 18px;
      border: 1px dashed rgba(244, 114, 182, 0.5);
      text-align: left;
    }

    .letter-content {
      font-family: 'Dancing Script', cursive;
      font-size: 1.45rem;
      line-height: 1.7;
      color: #fff1f2;
      white-space: pre-wrap;
    }

    /* KHU VỰC TRÁI TIM ẢNH */
    .heart-section {
      display: none;
      position: relative;
      z-index: 2;
      width: 100%;
      max-width: 440px;
      height: 420px;
      margin-top: 30px;
    }

    .heart-title {
      text-align: center;
      font-size: 1.2rem;
      color: var(--accent-pink);
      margin-bottom: 10px;
      font-weight: 600;
      text-shadow: 0 0 10px rgba(244, 114, 182, 0.6);
    }

    .heart-canvas {
      position: relative;
      width: 100%;
      height: 380px;
    }

    /* Từng tấm ảnh trong trái tim */
    .heart-photo {
      position: absolute;
      width: 54px;
      height: 54px;
      border-radius: 50%;
      object-fit: cover;
      border: 2px solid rgba(255, 255, 255, 0.8);
      box-shadow: 0 0 12px rgba(244, 114, 182, 0.7);
      cursor: pointer;
      transition: transform 0.3s ease, box-shadow 0.3s ease, z-index 0.3s;
      animation: pulse-glow 3s infinite alternate;
    }

    .heart-photo:hover {
      transform: scale(1.8) !important;
      z-index: 99 !important;
      box-shadow: 0 0 25px rgba(253, 224, 71, 1);
    }

    @keyframes pulse-glow {
      0% { filter: brightness(0.9); }
      100% { filter: brightness(1.15); }
    }

    /* Modal phóng to ảnh khi click */
    .modal {
      display: none;
      position: fixed;
      top: 0; left: 0;
      width: 100vw; height: 100vh;
      background: rgba(0, 0, 0, 0.85);
      backdrop-filter: blur(8px);
      z-index: 9999;
      justify-content: center;
      align-items: center;
    }
    .modal img {
      max-width: 85%;
      max-height: 80vh;
      border-radius: 18px;
      border: 3px solid #fff;
      box-shadow: 0 0 30px rgba(255, 255, 255, 0.5);
    }

    .music-btn {
      margin-top: 15px;
      background: rgba(255, 255, 255, 0.15);
      border: 1px solid rgba(255, 255, 255, 0.3);
      color: #fff;
      padding: 8px 18px;
      border-radius: 20px;
      font-size: 0.85rem;
      cursor: pointer;
    }
  </style>
</head>
<body>

  <div class="moon"></div>
  <div class="lantern lantern-1"></div>
  <div class="lantern lantern-2"></div>

  <div class="main-wrapper">
    <h1 class="title">Trung Thu Đoàn Viên 🌕</h1>
    <p class="subtitle">Đêm nay trăng rất sáng, nhưng người đẹp nhất vẫn là em...</p>

    <div id="interactiveArea">
      <div class="gift-btn" id="openGiftBtn" title="Chạm để mở">🥮</div>
      <p class="tap-hint" id="hintText">Chạm vào chiếc bánh để mở điều bất ngờ ✨</p>
    </div>

    <!-- Thư tình -->
    <div class="letter-box" id="letterBox">
      <div class="letter-content" id="typewriterText"></div>
    </div>

    <button class="music-btn" id="audioToggle">
      <span id="musicIcon">🎵</span> <span id="musicText">Bật nhạc nền</span>
    </button>
  </div>

  <!-- Trái tim ghép từ ảnh -->
  <div class="heart-section" id="heartSection">
    <p class="heart-title">💖 Những khoảnh khắc của chúng mình 💖</p>
    <div class="heart-canvas" id="heartCanvas"></div>
  </div>

  <!-- Modal xem ảnh lớn -->
  <div class="modal" id="photoModal">
    <img id="modalImg" src="" alt="Kỷ niệm" />
  </div>

  <!-- Nhạc nền Lofi -->
  <audio id="bgMusic" loop>
    <source src="https://assets.mixkit.co/music/preview/mixkit-silent-night-starry-sky-lo-fi-1168.mp3" type="audio/mpeg" />
  </audio>

  <script>
    // ==========================================
    // CẤU HÌNH SỐ LƯỢNG ẢNH TRONG THƯ MỤC images/
    // ==========================================
    const TOTAL_IMAGES = 30; // Đổi con số này đúng với số lượng ảnh bạn có: 1.jpg -> 20.jpg
    const IMAGE_FOLDER = 'images/';

    const giftBtn = document.getElementById('openGiftBtn');
    const hintText = document.getElementById('hintText');
    const letterBox = document.getElementById('letterBox');
    const typewriterText = document.getElementById('typewriterText');
    const heartSection = document.getElementById('heartSection');
    const heartCanvas = document.getElementById('heartCanvas');
    const photoModal = document.getElementById('photoModal');
    const modalImg = document.getElementById('modalImg');
    const bgMusic = document.getElementById('bgMusic');
    const audioToggle = document.getElementById('audioToggle');

    const message = 
`Gửi người anh thương nhất,\n
Người ta hay ngắm trăng rằm tháng Tám vì trăng tròn và sáng nhất năm. Nhưng đối với anh, từ ngày có em, ngày nào lòng anh cũng ấm áp và viên mãn như ngày hội trăng tròn.\n
Cảm ơn em vì đã luôn dịu dàng, luôn là nguồn động lực và niềm vui lớn nhất của anh. Chúc em yêu một mùa Trung thu thật ngọt ngào, bình yên và luôn cười thật tươi khi bên anh nhé! ❤️\n
Yêu em nhiều hơn mọi vầng trăng trên đời.`;

    let isOpened = false;

    // Phun tim và sao
    function fireConfetti() {
      confetti({
        particleCount: 50,
        spread: 70,
        origin: { y: 0.65 },
        colors: ['#f472b6', '#fde047', '#38bdf8']
      });
    }

    // Hiệu ứng typewriter
    function runTypewriter(text, index = 0) {
      if (index < text.length) {
        typewriterText.innerHTML += text.charAt(index) === '\n' ? '<br>' : text.charAt(index);
        setTimeout(() => runTypewriter(text, index + 1), 32);
      }
    }

    // Thuật toán tọa độ Trái Tim (Parametric Heart Equation)
    function buildHeartGallery() {
      const centerX = heartCanvas.clientWidth / 2;
      const centerY = heartCanvas.clientHeight / 2 - 15;
      const scale = 10.5; // Độ mở rộng của trái tim

      for (let i = 0; i < TOTAL_IMAGES; i++) {
        // Chia đều góc t từ 0 đến 2*PI
        const t = (Math.PI * 2 * i) / TOTAL_IMAGES;
        
        // Công thức hình trái tim toán học
        const x = 16 * Math.pow(Math.sin(t), 3);
        const y = -(13 * Math.cos(t) - 5 * Math.cos(2 * t) - 2 * Math.cos(3 * t) - Math.cos(4 * t));

        const posX = centerX + x * scale - 27; // Trừ nửa width ảnh (54/2)
        const posY = centerY + y * scale - 27;

        const img = document.createElement('img');
        img.className = 'heart-photo';
        img.src = `${IMAGE_FOLDER}${i + 1}.jpg`;
        img.style.left = `${posX}px`;
        img.style.top = `${posY}px`;
        img.style.animationDelay = `${(i * 0.15).toFixed(2)}s`;

        // Bấm vào ảnh nhỏ sẽ phóng to toàn màn hình
        img.addEventListener('click', () => {
          modalImg.src = img.src;
          photoModal.style.display = 'flex';
        });

        heartCanvas.appendChild(img);
      }
    }

    // Đóng popup xem ảnh
    photoModal.addEventListener('click', () => {
      photoModal.style.display = 'none';
    });

    // Mở hộp quà
    giftBtn.addEventListener('click', () => {
      if (isOpened) return;
      isOpened = true;

      fireConfetti();
      setInterval(fireConfetti, 4000);

      bgMusic.play().then(() => {
        document.getElementById('musicIcon').textContent = '🔊';
        document.getElementById('musicText').textContent = 'Tắt nhạc';
      }).catch(() => {});

      giftBtn.textContent = '🏮';
      hintText.textContent = 'Dành trọn vẹn sự dịu dàng này cho em ✨';
      letterBox.style.display = 'block';
      heartSection.style.display = 'block';

      runTypewriter(message);
      buildHeartGallery();

      // Cuộn nhẹ xuống để nhìn thấy trái tim
      setTimeout(() => {
        heartSection.scrollIntoView({ behavior: 'smooth' });
      }, 1000);
    });

    // Bật tắt nhạc
    audioToggle.addEventListener('click', () => {
      if (bgMusic.paused) {
        bgMusic.play();
        document.getElementById('musicIcon').textContent = '🔊';
        document.getElementById('musicText').textContent = 'Tắt nhạc';
      } else {
        bgMusic.pause();
        document.getElementById('musicIcon').textContent = '🎵';
        document.getElementById('musicText').textContent = 'Bật nhạc nền';
      }
    });
  </script>
</body>
</html>
