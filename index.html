<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Mùa Trăng Yêu Thương 🌕</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🏮</text></svg>">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Dancing+Script:wght@600;700&family=Nunito:wght@400;600;800&display=swap" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>

  <style>
    :root {
      --accent-yellow: #fde047;
      --accent-pink: #f472b6;
      --card-bg: rgba(15, 23, 42, 0.65);
      --card-border: rgba(255, 255, 255, 0.2);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      min-height: 100vh;
      background: radial-gradient(circle at 50% 10%, #1e1b4b 0%, #0f172a 55%, #020617 100%);
      font-family: 'Nunito', sans-serif;
      color: #fff;
      overflow-x: hidden;
      display: flex;
      flex-direction: column;
      align-items: center;
      position: relative;
      padding-bottom: 70px;
    }

    /* Bầu trời sao động */
    #starCanvas {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      z-index: 0;
      pointer-events: none;
    }

    /* Vầng trăng rằm 3D phát sáng */
    .moon {
      position: fixed;
      top: 20px;
      right: 25px;
      width: 75px;
      height: 75px;
      background: radial-gradient(circle at 35% 35%, #fffbeb 0%, #fde047 60%, #eab308 100%);
      border-radius: 50%;
      box-shadow: 0 0 35px #fde047, 0 0 75px rgba(253, 224, 71, 0.45);
      z-index: 1;
      pointer-events: none;
      animation: moonGlow 4s ease-in-out infinite alternate;
    }

    @keyframes moonGlow {
      0% { box-shadow: 0 0 25px #fde047, 0 0 50px rgba(253, 224, 71, 0.3); }
      100% { box-shadow: 0 0 45px #fde047, 0 0 95px rgba(253, 224, 71, 0.6); }
    }

    /* Thẻ đếm ngày yêu nhau */
    .love-days-badge {
      position: fixed;
      top: 25px;
      left: 20px;
      background: rgba(255, 255, 255, 0.12);
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
      border: 1px solid rgba(255, 255, 255, 0.25);
      padding: 6px 14px;
      border-radius: 20px;
      font-size: 0.85rem;
      font-weight: 600;
      color: #fbcfe8;
      z-index: 2;
      box-shadow: 0 4px 15px rgba(0,0,0,0.3);
    }

    /* Container chính: Đã tối ưu mở rộng sang ngang trên laptop */
    .main-wrapper {
      position: relative;
      z-index: 2;
      width: min(92vw, 680px);
      margin-top: 100px;
      padding: clamp(20px, 5vw, 36px);
      background: var(--card-bg);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border-radius: 28px;
      border: 1px solid var(--card-border);
      box-shadow: 0 20px 50px rgba(0, 0, 0, 0.55);
      text-align: center;
      transition: transform 0.3s ease;
    }

    .title {
      font-size: clamp(1.5rem, 5vw, 1.9rem);
      font-weight: 800;
      color: var(--accent-yellow);
      text-shadow: 0 0 15px rgba(253, 224, 71, 0.5);
      margin-bottom: 8px;
    }

    .subtitle {
      font-size: 0.95rem;
      color: #cbd5e1;
      margin-bottom: 22px;
      line-height: 1.5;
    }

    /* Nút hộp quà */
    .interactive-box {
      margin: 10px 0;
    }

    .gift-btn {
      cursor: pointer;
      font-size: 4.8rem;
      display: inline-block;
      user-select: none;
      filter: drop-shadow(0 8px 20px rgba(253, 224, 71, 0.5));
      animation: pulseBtn 2s infinite ease-in-out;
      transition: transform 0.2s;
    }
    .gift-btn:active {
      transform: scale(0.9);
    }

    @keyframes pulseBtn {
      0%, 100% { transform: scale(1) translateY(0); }
      50% { transform: scale(1.1) translateY(-6px); }
    }

    .tap-hint {
      margin-top: 10px;
      font-size: 0.88rem;
      color: #fbcfe8;
      letter-spacing: 0.3px;
    }

    /* Hộp thư gõ chữ */
    .letter-box {
      display: none;
      margin-top: 22px;
      padding: 22px 20px;
      background: rgba(2, 6, 23, 0.65);
      border-radius: 20px;
      border: 1px dashed rgba(244, 114, 182, 0.6);
      text-align: left;
      box-shadow: inset 0 0 20px rgba(0, 0, 0, 0.4);
    }

    .letter-content {
      font-family: 'Dancing Script', cursive;
      font-size: clamp(1.3rem, 4.8vw, 1.55rem);
      line-height: 1.7;
      color: #fff1f2;
      white-space: pre-wrap;
    }

    /* VÙNG TRÁI TIM ẢNH VIP */
    .heart-section {
      display: none;
      position: relative;
      z-index: 2;
      width: 100vw;
      max-width: 680px;
      margin-top: 40px;
      text-align: center;
    }

    .heart-title {
      font-size: 1.3rem;
      font-weight: 700;
      color: var(--accent-pink);
      text-shadow: 0 0 12px rgba(244, 114, 182, 0.8);
      margin-bottom: 14px;
    }

    .heart-canvas {
      position: relative;
      width: 100%;
      height: min(85vw, 470px);
      margin: 0 auto;
      animation: heartbeat 2.8s infinite ease-in-out;
    }

    @keyframes heartbeat {
      0%, 100% { transform: scale(1); }
      14% { transform: scale(1.04); }
      28% { transform: scale(1); }
      42% { transform: scale(1.03); }
      70% { transform: scale(1); }
    }

    .heart-photo {
      position: absolute;
      width: var(--photo-size, 34px);
      height: var(--photo-size, 34px);
      border-radius: 50%;
      object-fit: cover;
      border: 2px solid rgba(255, 255, 255, 0.95);
      box-shadow: 0 0 12px rgba(244, 114, 182, 0.85);
      cursor: pointer;
      transition: transform 0.3s cubic-bezier(0.34, 1.56, 0.64, 1), box-shadow 0.3s;
    }

    .heart-photo:hover, .heart-photo:active {
      transform: scale(2.2) !important;
      z-index: 100 !important;
      box-shadow: 0 0 20px rgba(253, 224, 71, 1), 0 0 35px rgba(244, 114, 182, 1);
      border-color: #fde047;
    }

    /* Modal phóng to ảnh */
    .modal {
      display: none;
      position: fixed;
      top: 0; left: 0;
      width: 100vw; height: 100vh;
      background: rgba(0, 0, 0, 0.88);
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
      z-index: 9999;
      justify-content: center;
      align-items: center;
      padding: 20px;
    }

    .modal-content {
      position: relative;
      display: inline-block;
    }

    .modal img {
      max-width: 88vw;
      max-height: 80vh;
      border-radius: 20px;
      border: 3px solid #fff;
      box-shadow: 0 0 35px rgba(255, 255, 255, 0.6);
      animation: zoomIn 0.3s ease;
      display: block;
    }

    .modal-close {
      position: absolute;
      top: -14px;
      right: -14px;
      background: #f43f5e;
      color: #fff;
      border: 2px solid #fff;
      border-radius: 50%;
      width: 32px;
      height: 32px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1rem;
      cursor: pointer;
      box-shadow: 0 4px 10px rgba(0,0,0,0.5);
    }

    @keyframes zoomIn {
      from { transform: scale(0.7); opacity: 0; }
      to { transform: scale(1); opacity: 1; }
    }

    /* Nút phát nhạc */
    .music-btn {
      margin-top: 18px;
      background: rgba(255, 255, 255, 0.12);
      border: 1px solid rgba(255, 255, 255, 0.3);
      color: #fff;
      padding: 8px 18px;
      border-radius: 25px;
      font-size: 0.85rem;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      transition: all 0.25s;
    }
    .music-btn:hover {
      background: rgba(255, 255, 255, 0.22);
      transform: translateY(-2px);
    }

    /* Đèn lồng bay */
    .sky-lantern {
      position: fixed;
      bottom: -60px;
      width: 32px;
      height: 42px;
      background: radial-gradient(circle, #fca5a5 20%, #e11d48 90%);
      border-radius: 8px 8px 16px 16px;
      box-shadow: 0 0 20px rgba(225, 29, 72, 0.85);
      opacity: 0.85;
      z-index: 1;
      pointer-events: none;
      animation: flyUp linear forwards;
    }
    @keyframes flyUp {
      0% { transform: translateY(0) rotate(0deg); opacity: 0; }
      10% { opacity: 0.85; }
      90% { opacity: 0.85; }
      100% { transform: translateY(-115vh) rotate(15deg); opacity: 0; }
    }

    /* Tim bay khi chạm màn hình */
    .floating-heart {
      position: fixed;
      font-size: 1.5rem;
      pointer-events: none;
      z-index: 99999;
      animation: floatHeart 1.2s ease-out forwards;
    }
    @keyframes floatHeart {
      0% { transform: scale(0.5) translateY(0); opacity: 1; }
      100% { transform: scale(1.6) translateY(-90px); opacity: 0; }
    }
  </style>
</head>
<body>

  <!-- Bầu trời sao -->
  <canvas id="starCanvas"></canvas>

  <!-- Trăng rằm & Đếm ngày yêu -->
  <div class="moon"></div>
  <div class="love-days-badge" id="loveCounter">Đang đếm yêu thương...</div>

  <!-- Khung nội dung chính -->
  <div class="main-wrapper">
    <h1 class="title">Trung Thu Đoàn Viên 🌕</h1>
    <p class="subtitle">Đêm nay trăng sáng nhất trời, nhưng người rạng rỡ nhất đời là em...</p>

    <div class="interactive-box">
      <div class="gift-btn" id="openGiftBtn" title="Chạm để mở">🥮</div>
      <p class="tap-hint" id="hintText">Chạm vào chiếc bánh để mở điều bất ngờ ✨</p>
    </div>

    <!-- Bức thư gõ tay -->
    <div class="letter-box" id="letterBox">
      <div class="letter-content" id="typewriterText"></div>
    </div>

    <!-- Bật/tắt nhạc -->
    <button class="music-btn" id="audioToggle">
      <span id="musicIcon">🎵</span> <span id="musicText">Bật nhạc nền</span>
    </button>
  </div>

  <!-- Vùng trái tim ảnh -->
  <div class="heart-section" id="heartSection">
    <p class="heart-title">💖 Em bé của anh 💖</p>
    <div class="heart-canvas" id="heartCanvas"></div>
  </div>

  <!-- Popup ảnh lớn -->
  <div class="modal" id="photoModal">
    <div class="modal-content">
      <span class="modal-close" id="modalClose">✕</span>
      <img id="modalImg" src="" alt="Kỷ niệm" />
    </div>
  </div>

  <!-- File nhạc nền trong repo -->
  <audio id="bgMusic" loop preload="auto">
    <source src="./music.mp3" type="audio/mpeg" />
  </audio>

  <script>
    const TOTAL_IMAGES = 30;
    const START_DATE = "2026-08-29";

    const message = 
`Gửi người anh thương nhất,\n
Người ta thường ngắm trăng rằm tháng Tám vì trăng tròn và sáng nhất năm. Nhưng đối với anh, từ ngày có em bước vào cuộc đời, ngày nào lòng anh cũng bình yên và trọn vẹn như đêm trăng tròn.\n
Cảm ơn em vì đã luôn dịu dàng, luôn đồng hành và là nụ cười ấm áp nhất của anh. Chúc em yêu một mùa Trung thu thật ngọt ngào, hạnh phúc và mãi luôn rạng rỡ khi bên anh! ❤️\n
Yêu em nhiều hơn tất cả các vì sao trên bầu trời đêm nay.`;

    // 1. Tính số ngày yêu
    function updateLoveDays() {
      const start = new Date(START_DATE).getTime();
      const now = new Date().getTime();
      const diffDays = Math.floor((now - start) / (1000 * 60 * 60 * 24));
      document.getElementById('loveCounter').innerHTML = `💕 Bên nhau: <strong>${diffDays > 0 ? diffDays : 1}</strong> ngày`;
    }
    updateLoveDays();

    // 2. Hiệu ứng Canvas Bầu Trời Sao Lấp Lánh
    const canvas = document.getElementById('starCanvas');
    const ctx = canvas.getContext('2d');
    let stars = [];

    function resizeCanvas() {
      canvas.width = window.innerWidth;
      canvas.height = window.innerHeight;
      stars = [];
      const numStars = Math.floor((canvas.width * canvas.height) / 4000);
      for (let i = 0; i < numStars; i++) {
        stars.push({
          x: Math.random() * canvas.width,
          y: Math.random() * canvas.height,
          radius: Math.random() * 1.5,
          alpha: Math.random(),
          speed: Math.random() * 0.02 + 0.005
        });
      }
    }
    window.addEventListener('resize', resizeCanvas);
    resizeCanvas();

    function drawStars() {
      ctx.clearRect(0, 0, canvas.width, canvas.height);
      stars.forEach(star => {
        star.alpha += star.speed;
        if (star.alpha > 1 || star.alpha < 0) star.speed = -star.speed;
        ctx.fillStyle = `rgba(255, 255, 255, ${Math.abs(star.alpha)})`;
        ctx.beginPath();
        ctx.arc(star.x, star.y, star.radius, 0, Math.PI * 2);
        ctx.fill();
      });
      requestAnimationFrame(drawStars);
    }
    drawStars();

    // 3. Tự động thả đèn lồng bay lên trời
    function spawnLantern() {
      const lantern = document.createElement('div');
      lantern.className = 'sky-lantern';
      lantern.style.left = `${Math.random() * 88 + 5}vw`;
      lantern.style.animationDuration = `${Math.random() * 5 + 8}s`;
      lantern.style.transform = `scale(${Math.random() * 0.4 + 0.8})`;
      document.body.appendChild(lantern);
      setTimeout(() => lantern.remove(), 13000);
    }
    setInterval(spawnLantern, 2500);

    // 4. Cơ chế load ảnh bắt mọi loại đuôi file
    const EXTENSIONS = ['jpg', 'png', 'jpeg', 'JPG', 'PNG', 'webp'];
    function loadImageSmart(imgElement, baseIndex, extIndex = 0) {
      if (extIndex >= EXTENSIONS.length) {
        imgElement.style.display = 'none';
        return;
      }
      const path = `./images/${baseIndex}.${EXTENSIONS[extIndex]}`;
      const temp = new Image();
      temp.onload = () => {
        imgElement.src = path;
        imgElement.style.display = 'block';
      };
      temp.onerror = () => loadImageSmart(imgElement, baseIndex, extIndex + 1);
      temp.src = path;
    }

    // Bảng 30 toạ độ chuẩn đối xứng từng cặp (X, Y)
// Đỉnh tim uốn lượn chữ V nông mềm mại, không bao giờ bị tụt hay dồn ảnh ở rãnh
const HEART_COORDS_30 = [
  // 1. Điểm chóp đáy duy nhất (Index 0)
  {x:  0.0, y: 17.5},

  // 2. Cánh phải đi ngược lên đỉnh (14 điểm)
  {x:  1.6, y: 15.3},
  {x:  3.6, y: 13.0},
  {x:  5.9, y: 10.7},
  {x:  8.4, y:  8.3},
  {x: 10.9, y:  5.7},
  {x: 13.2, y:  2.8},
  {x: 14.8, y: -0.3},
  {x: 15.4, y: -3.5},
  {x: 14.7, y: -6.6},
  {x: 12.8, y: -9.2},
  {x: 10.2, y: -10.5},
  {x:  7.2, y: -10.3},
  {x:  4.4, y: -8.7},
  {x:  2.2, y: -6.2}, // Mép hõm trên bên phải (đủ cao và thoáng)

  // 3. Mép hõm trên bên trái đối xứng (Index 15)
  {x: -2.2, y: -6.2}, // Mép hõm trên bên trái

  // 4. Cánh trái đi xuôi xuống lại đáy (14 điểm đối xứng gương)
  {x: -4.4, y: -8.7},
  {x: -7.2, y: -10.3},
  {x: -10.2, y: -10.5},
  {x: -12.8, y: -9.2},
  {x: -14.7, y: -6.6},
  {x: -15.4, y: -3.5},
  {x: -14.8, y: -0.3},
  {x: -13.2, y:  2.8},
  {x: -10.9, y:  5.7},
  {x:  -8.4, y:  8.3},
  {x:  -5.9, y: 10.7},
  {x:  -3.6, y: 13.0},
  {x:  -1.6, y: 15.3},
  {x:  -0.5, y: 16.8}  // Vuốt êm vào chóp đáy
];
    const heartCanvas = document.getElementById('heartCanvas');
    const photoModal = document.getElementById('photoModal');
    const modalImg = document.getElementById('modalImg');
    const modalClose = document.getElementById('modalClose');

    function buildHeartGallery() {
    // Lấy chiều rộng khả dụng thực tế của màn hình
    const screenWidth = Math.min(window.innerWidth, heartCanvas.clientWidth || window.innerWidth);
    
    // TÍNH TOÁN LIÊN TỤC THEO MÀN HÌNH (AUTOFIT TUYỆT ĐỐI)
    // Màn hình nhỏ (360px) -> size ~26px, scale ~8.5
    // Màn hình laptop (800px+) -> size ~36px, scale ~12.5
    const photoSize = Math.max(25, Math.min(36, Math.floor(screenWidth * 0.075)));
    const scale = Math.max(8.0, Math.min(12.5, screenWidth * 0.026));

    const centerX = (heartCanvas.clientWidth || screenWidth) / 2;
    const centerY = ((heartCanvas.clientHeight || 460) / 2) - 15;

    heartCanvas.style.setProperty('--photo-size', `${photoSize}px`);
    heartCanvas.innerHTML = '';
    const halfSize = photoSize / 2;

    for (let i = 0; i < TOTAL_IMAGES; i++) {
        const pt = HEART_COORDS_30[i];

        const posX = centerX + pt.x * scale - halfSize;
        const posY = centerY + pt.y * scale - halfSize;

        const img = document.createElement('img');
        img.className = 'heart-photo';
        img.style.left = `${posX}px`;
        img.style.top = `${posY}px`;
        img.style.animationDelay = `${(i * 0.06).toFixed(2)}s`;

        loadImageSmart(img, i + 1);

        img.addEventListener('click', (e) => {
        e.stopPropagation();
        modalImg.src = img.src;
        photoModal.style.display = 'flex';
        });

        heartCanvas.appendChild(img);
    }
    }

    photoModal.addEventListener('click', () => { photoModal.style.display = 'none'; });
    modalClose.addEventListener('click', (e) => {
      e.stopPropagation();
      photoModal.style.display = 'none';
    });

    // 6. Hiệu ứng gõ thư Typewriter: Gõ xong hết mới kích hoạt callback
    const typewriterText = document.getElementById('typewriterText');
    function runTypewriter(text, index = 0, onComplete = null) {
      if (index < text.length) {
        typewriterText.innerHTML += text.charAt(index) === '\n' ? '<br>' : text.charAt(index);
        setTimeout(() => runTypewriter(text, index + 1, onComplete), 32);
      } else {
        if (typeof onComplete === 'function') {
          setTimeout(onComplete, 500);
        }
      }
    }

    // 7. Kích hoạt mở quà
    const giftBtn = document.getElementById('openGiftBtn');
    const letterBox = document.getElementById('letterBox');
    const heartSection = document.getElementById('heartSection');
    const bgMusic = document.getElementById('bgMusic');
    const audioToggle = document.getElementById('audioToggle');
    let isOpened = false;

    giftBtn.addEventListener('click', () => {
      if (isOpened) return;
      isOpened = true;

      confetti({ particleCount: 60, spread: 80, origin: { y: 0.6 } });

      bgMusic.play().then(() => {
        document.getElementById('musicIcon').textContent = '🔊';
        document.getElementById('musicText').textContent = 'Tắt nhạc';
      }).catch(() => {});

      giftBtn.textContent = '🏮';
      giftBtn.style.animation = 'none';
      document.getElementById('hintText').textContent = 'Món quà trọn vẹn dành tặng riêng em ✨';

      // Chỉ hiện khung thư trước
      letterBox.style.display = 'block';

      // Chạy chữ xong xuôi hoàn toàn mới hiện trái tim
      runTypewriter(message, 0, () => {
        heartSection.style.display = 'block';
        buildHeartGallery();

        // Bắn thêm pháo hoa khi trái tim xuất hiện
        confetti({ particleCount: 70, spread: 90, origin: { y: 0.7 } });
        setInterval(() => {
          confetti({ particleCount: 35, spread: 60, origin: { y: 0.65 }, colors: ['#f472b6', '#fde047', '#38bdf8'] });
        }, 4000);

        // Tự động cuộn mượt xuống trái tim ảnh
        setTimeout(() => {
          heartSection.scrollIntoView({ behavior: 'smooth', block: 'center' });
        }, 300);
      });
    });

    // Nút tắt/bật nhạc
    audioToggle.addEventListener('click', () => {
      if (bgMusic.paused) {
        bgMusic.play();
        document.getElementById('musicIcon').textContent = '🔊';
        document.getElementById('musicText').textContent = 'Tắt nhạc';
      } else {
        bgMusic.pause();
        document.getElementById('musicIcon').textContent = '🎵';
        document.getElementById('musicText').textContent = 'Bật nhạc';
      }
    });

    // Tự căn chỉnh lại nếu xoay màn hình
    window.addEventListener('resize', () => {
      if (isOpened && heartSection.style.display === 'block') {
        buildHeartGallery();
      }
    });

    // Hiệu ứng chạm màn hình bung tim phát sáng
    document.addEventListener('pointerdown', (e) => {
      if (e.target.closest('#openGiftBtn, .heart-photo, .music-btn, #photoModal')) return;
      const heart = document.createElement('div');
      heart.className = 'floating-heart';
      heart.innerHTML = ['💖', '✨', '🌸', '🏮'][Math.floor(Math.random() * 4)];
      heart.style.left = `${e.clientX - 12}px`;
      heart.style.top = `${e.clientY - 12}px`;
      document.body.appendChild(heart);
      setTimeout(() => heart.remove(), 1200);
    });
  </script>
</body>
</html>
